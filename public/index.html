<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOUTH SHOP - Phong cách của bạn</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">

    <style>
        .navbar-youth {
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow-sm);
        }

        .navbar-brand {
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--primary-color) !important;
        }

        .hero-section {
            background: linear-gradient(135deg, #111827 0%, #374151 100%);
            color: white;
            padding: 80px 0;
            border-radius: var(--radius-lg);
            margin: 20px 0;
            text-align: center;
        }

        .product-img-wrapper {
            overflow: hidden;
            border-top-left-radius: var(--radius-lg);
            border-top-right-radius: var(--radius-lg);
        }

        .product-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            transition: var(--transition);
        }

        .youth-card:hover .product-img {
            transform: scale(1.05);
        }

        .product-price {
            font-weight: 700;
            color: var(--accent-color);
            font-size: 1.1rem;
        }

        .out-of-stock-card {
            opacity: 0.65;
        }

        .out-of-stock-img {
            filter: grayscale(100%);
        }

        .stock-badge {
            font-size: 0.8rem;
            color: #4b5563;
        }
    </style>
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    <!-- HEADER -->
    <nav class="navbar navbar-expand-lg navbar-youth sticky-top py-3">
        <div class="container">
            <a class="navbar-brand" href="/index.html">YOUTH SHOP</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item"><a class="nav-link active" href="/index.html">Trang chủ</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Sản phẩm</a></li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <a href="/cart.html" class="position-relative text-dark text-decoration-none">
                        <i class="fa-solid fa-cart-shopping fs-5"></i>
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="cartCount">0</span>
                    </a>
                    <button class="btn btn-outline-danger btn-sm ms-3" onclick="logout()">Thoát</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- HERO BANNER -->
    <div class="container">
        <div class="hero-section">
            <h1 class="display-5 fw-bold mb-3">Định hình phong cách giới trẻ</h1>
            <p class="lead mb-4">Sỉ lẻ liên hệ tele: @dichvucodegiare.</p>
            <a href="#products" class="btn btn-primary btn-youth px-4 py-2">MUA NGAY</a>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="container my-5 flex-grow-1" id="products">
        <h2 class="fw-bold mb-4">Sản phẩm nổi bật</h2>

        <!-- THANH LỌC DANH MỤC (CATEGORY FILTER TABS) -->
        <div class="d-flex flex-wrap gap-2 mb-4" id="categoryTabs">
            <button class="btn btn-dark btn-sm rounded-pill px-3 active" onclick="filterByCategory('all', this)">Tất cả</button>
        </div>

        <!-- DANH SÁCH SẢN PHẨM -->
        <div class="row g-4" id="productList">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-white py-4 mt-auto border-top">
        <div class="container text-center text-muted">
            <p class="mb-0">&copy; 2026 YOUTH SHOP. All rights reserved.</p>
        </div>
    </footer>

    <!-- SCRIPTS -->
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/main.js"></script>
</body>

</html>
