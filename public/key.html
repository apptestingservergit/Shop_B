<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy cập - YOUTH SHOP</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css">
    
    <style>
        /* CSS riêng cho trang nhập KEY */
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f6f8fd 0%, #f1f5f9 100%);
        }
        .key-container {
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            text-align: center;
        }
        .logo-text {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--primary-color);
            margin-bottom: 30px;
        }
        .form-control-youth {
            border-radius: 8px;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            font-size: 16px;
            text-align: center;
            letter-spacing: 1px;
            margin-bottom: 20px;
            transition: var(--transition);
        }
        .form-control-youth:focus {
            border-color: var(--accent-color);
            box-shadow: none;
            outline: none;
        }
    </style>
</head>
<body>

    <div class="youth-card key-container">
        <div class="logo-text">YOUTH SHOP</div>
        <p class="text-muted mb-4">Vui lòng nhập mã truy cập để vào cửa hàng</p>
        
        <form id="keyForm">
            <input type="text" id="accessKey" class="form-control form-control-youth" placeholder="MÃ TRUY CẬP" autocomplete="off" required>
            <button type="submit" id="submitBtn" class="btn btn-youth w-100">
                <i class="fa-solid fa-unlock-keyhole me-2"></i> TRUY CẬP
            </button>
        </form>
    </div>

    <!-- SweetAlert2 cho thông báo -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Link tới file JS xử lý logic -->
    <script src="/js/key.js"></script>
</body>
</html>
