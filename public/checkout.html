<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán - YOUTH SHOP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .navbar-youth { background-color: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); box-shadow: var(--shadow-sm); }
        .navbar-brand { font-weight: 700; letter-spacing: 1px; color: var(--primary-color) !important; }
        .form-control, .form-select { border-radius: 8px; padding: 12px 16px; border-color: var(--border-color); }
        .form-control:focus { border-color: var(--accent-color); box-shadow: 0 0 0 0.25rem rgba(37, 99, 235, 0.1); }
        .summary-card { background: var(--card-bg); border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow-sm); border: 1px solid var(--border-color); position: sticky; top: 90px; }
        .checkout-item-img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- HEADER -->
    <nav class="navbar navbar-expand-lg navbar-youth sticky-top py-3">
        <div class="container">
            <a class="navbar-brand" href="/cart.html"><i class="fa-solid fa-arrow-left me-2"></i> QUAY LẠI GIỎ HÀNG</a>
        </div>
    </nav>

    <!-- TRANG CHECKOUT -->
    <div class="container my-5 flex-grow-1">
        <div class="row g-5">
            
            <!-- Cột trái: Form thông tin -->
            <div class="col-lg-7">
                <h3 class="fw-bold mb-4">Thông tin giao hàng</h3>
                <div class="youth-card p-4">
                    <form id="checkoutForm">
                        <div class="mb-3">
                            <label class="form-label fw-medium">Họ và tên <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="fullName" placeholder="Nhập họ và tên của bạn" required>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-medium">Số điện thoại <span class="text-danger">*</span></label>
                                <input type="tel" class="form-control" id="phone" placeholder="VD: 0912345678" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-medium">Email <span class="text-muted">(Không bắt buộc)</span></label>
                                <input type="email" class="form-control" id="email" placeholder="email@example.com">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-medium">Địa chỉ giao hàng <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="address" placeholder="Số nhà, tên đường, phường/xã, quận/huyện, tỉnh/thành phố" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-medium">Ghi chú đơn hàng</label>
                            <textarea class="form-control" id="note" rows="3" placeholder="Ghi chú thêm về đơn hàng (ví dụ: giao giờ hành chính)..."></textarea>
                        </div>
                        
                        <button type="submit" class="btn btn-youth w-100 py-3 fs-5 fw-bold" id="placeOrderBtn">
                            TIẾN HÀNH ĐẶT HÀNG
                        </button>
                    </form>
                </div>
            </div>

            <!-- Cột phải: Tóm tắt đơn hàng -->
            <div class="col-lg-5">
                <div class="summary-card">
                    <h5 class="fw-bold mb-4">Đơn hàng của bạn</h5>
                    
                    <!-- Nơi hiển thị danh sách sản phẩm rút gọn -->
                    <div id="checkoutItems" class="mb-4 pb-4 border-bottom">
                        <!-- Đổ dữ liệu bằng JS -->
                    </div>

                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Tạm tính:</span>
                        <span id="subtotalAmount" class="fw-medium">0 ₫</span>
                    </div>
                    <div class="d-flex justify-content-between mb-3 pb-3 border-bottom">
                        <span class="text-muted">Phí vận chuyển:</span>
                        <span id="shippingFee" class="fw-medium">30.000 ₫</span>
                    </div>
                    <div class="d-flex justify-content-between">
                        <span class="fw-bold fs-5">Tổng cộng:</span>
                        <span id="totalAmount" class="fw-bold fs-5 text-primary">0 ₫</span>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-white py-4 mt-auto border-top">
        <div class="container text-center text-muted"><p class="mb-0">&copy; 2026 YOUTH SHOP.</p></div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Script xử lý Checkout -->
    <script src="/js/checkout.js"></script>
</body>
</html>
