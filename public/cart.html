<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng - YOUTH SHOP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .navbar-youth { background-color: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); box-shadow: var(--shadow-sm); }
        .navbar-brand { font-weight: 700; letter-spacing: 1px; color: var(--primary-color) !important; }
        .cart-img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; }
        .qty-btn { width: 32px; height: 32px; padding: 0; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
        .summary-card { background: var(--card-bg); border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow-sm); border: 1px solid var(--border-color); position: sticky; top: 90px; }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- HEADER -->
    <nav class="navbar navbar-expand-lg navbar-youth sticky-top py-3">
        <div class="container">
            <a class="navbar-brand" href="/index.html"><i class="fa-solid fa-arrow-left me-2"></i> TIẾP TỤC MUA SẮM</a>
        </div>
    </nav>

    <!-- TRANG GIỎ HÀNG -->
    <div class="container my-5 flex-grow-1">
        <h3 class="fw-bold mb-4">Giỏ hàng của bạn</h3>
        
        <div class="row g-4">
            <!-- Cột trái: Danh sách sản phẩm -->
            <div class="col-lg-8">
                <div class="youth-card p-0 overflow-hidden" id="cartItemsContainer">
                    <!-- Javascript sẽ render các sản phẩm vào đây -->
                </div>
            </div>

            <!-- Cột phải: Tổng tiền (Summary) -->
            <div class="col-lg-4">
                <div class="summary-card">
                    <h5 class="fw-bold mb-4">Tổng đơn hàng</h5>
                    <div class="d-flex justify-content-between mb-3">
                        <span class="text-muted">Tạm tính:</span>
                        <span id="subtotalAmount" class="fw-medium">0 ₫</span>
                    </div>
                    <div class="d-flex justify-content-between mb-3 pb-3 border-bottom">
                        <span class="text-muted">Phí vận chuyển:</span>
                        <span id="shippingFee" class="fw-medium">30.000 ₫</span>
                    </div>
                    <div class="d-flex justify-content-between mb-4">
                        <span class="fw-bold fs-5">Tổng cộng:</span>
                        <span id="totalAmount" class="fw-bold fs-5 text-primary">0 ₫</span>
                    </div>
                    <a href="/checkout.html" class="btn btn-youth w-100 py-2 fs-5 d-flex justify-content-center align-items-center">
                        TIẾN HÀNH MUA HÀNG <i class="fa-solid fa-arrow-right ms-2"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-white py-4 mt-auto border-top">
        <div class="container text-center text-muted"><p class="mb-0">&copy; 2026 YOUTH SHOP.</p></div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Script riêng cho trang Giỏ hàng -->
    <script src="/js/cart.js"></script>
</body>
</html>
