<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xếp hạng Khách hàng - Admin YOUTH SHOP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .sidebar {
            width: 260px;
            min-height: 100vh;
            background: #111827;
            color: white;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
            transition: transform 0.3s ease-in-out;
        }

        .sidebar a {
            color: #9ca3af;
            text-decoration: none;
            padding: 12px 20px;
            display: block;
            transition: var(--transition);
            border-radius: 8px;
            margin: 4px 12px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            color: white;
            background: rgba(255, 255, 255, 0.1);
        }

        .main-content {
            margin-left: 260px;
            padding: 30px;
        }

        .vip-badge {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
            font-weight: bold;
        }

        /* Responsive cho Mobile */
        @media (max-width: 991.98px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.show { transform: translateX(0); }
            .main-content { margin-left: 0 !important; padding: 15px !important; }
        }
    </style>
</head>

<body class="bg-light">

    <!-- MOBILE NAVBAR HEADER (Chỉ hiện trên điện thoại) -->
    <nav class="navbar navbar-dark bg-dark d-lg-none px-3 py-2">
        <button class="btn btn-outline-light btn-sm" onclick="toggleSidebar()">
            <i class="fa-solid fa-bars fs-5"></i>
        </button>
        <span class="navbar-brand fs-6 fw-bold">ADMIN PANEL</span>
        <button class="btn btn-outline-danger btn-sm" onclick="adminLogout()"><i class="fa-solid fa-right-from-bracket"></i></button>
    </nav>

    <!-- SIDEBAR -->
    <div class="sidebar d-flex flex-column py-4" id="adminSidebar">
        <div class="d-flex justify-content-between align-items-center px-3 mb-4 d-lg-none">
            <h4 class="fw-bold tracking-wider mb-0 text-white">MENU</h4>
            <button class="btn text-white fs-4" onclick="toggleSidebar()">&times;</button>
        </div>
        <h4 class="text-center fw-bold mb-4 tracking-wider d-none d-lg-block">ADMIN PANEL</h4>
        <div class="flex-grow-1">
            <a href="/admin/dashboard.html"><i class="fa-solid fa-chart-pie me-2"></i> Dashboard</a>
            <a href="/admin/orders.html"><i class="fa-solid fa-box-open me-2"></i> Quản lý Đơn hàng</a>
            <a href="/admin/products.html"><i class="fa-solid fa-shirt me-2"></i> Quản lý Sản phẩm</a>
            <a href="/admin/categories.html"><i class="fa-solid fa-list me-2"></i> Quản lý Danh mục</a>
            <a href="/admin/keys.html"><i class="fa-solid fa-key me-2"></i> Quản lý KEY</a>
            <a href="/admin/customers.html" class="active"><i class="fa-solid fa-users me-2"></i> Khách hàng VIP</a>
            <a href="/admin/top-products.html"><i class="fa-solid fa-fire me-2"></i> Top Bán chạy</a>
            <a href="/admin/settings.html"><i class="fa-solid fa-gear me-2"></i> Cài đặt</a>
        </div>
        <div class="px-3 d-none d-lg-block">
            <button class="btn btn-outline-danger w-100 btn-sm" onclick="adminLogout()"><i
                    class="fa-solid fa-right-from-bracket me-2"></i> Đăng xuất</button>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <h2 class="fw-bold mb-4 fs-4">Xếp hạng Khách hàng theo Doanh thu</h2>
        <div class="youth-card p-3 p-md-4">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Thứ hạng</th>
                            <th>Khách hàng</th>
                            <th>Số điện thoại</th>
                            <th>Tổng đơn hàng</th>
                            <th>Tổng doanh thu đóng góp</th>
                            <th>Địa chỉ nhận hàng</th>
                        </tr>
                    </thead>
                    <tbody id="customersTableBody">
                        <tr>
                            <td colspan="6" class="text-center py-4">Đang tải dữ liệu...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        const formatMoney = (amount) => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount);
        const checkAdminAuth = () => { if (!localStorage.getItem('ADMIN_TOKEN')) window.location.href = '/admin/login.html'; };

        // Hàm bật/tắt Sidebar trên mobile
        const toggleSidebar = () => {
            document.getElementById('adminSidebar').classList.toggle('show');
        };

        const loadCustomerRanking = async () => {
            try {
                const token = localStorage.getItem('ADMIN_TOKEN');
                const res = await fetch('/api/orders/admin/all', { headers: { 'Authorization': `Bearer ${token}` } });
                const result = await res.json();

                if (result.success) {
                    const tbody = document.getElementById('customersTableBody');
                    if (result.data.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">Chưa có dữ liệu khách hàng.</td></tr>`;
                        return;
                    }

                    // 1. Gom nhóm dữ liệu khách hàng theo số điện thoại
                    const customersMap = new Map();
                    result.data.forEach(order => {
                        // QUAN TRỌNG: CHỈ XÉT CÁC ĐƠN HÀNG ĐÃ ĐẠT TRẠNG THÁI 'paid' (Đã thanh toán / Hoàn tất)
                        if (order.status === 'paid') {
                            if (!customersMap.has(order.phone)) {
                                customersMap.set(order.phone, {
                                    fullName: order.fullName,
                                    phone: order.phone,
                                    email: order.email || 'Không có',
                                    address: order.address,
                                    totalOrders: 0, // Số đơn hoàn tất
                                    totalSpent: 0   // Tổng tiền đã thanh toán
                                });
                            }

                            const customer = customersMap.get(order.phone);
                            customer.totalOrders += 1;          // Tăng đếm số đơn hoàn tất
                            customer.totalSpent += order.total; // Cộng dồn tiền vào doanh thu xếp hạng
                        }
                    });

                    // Nếu không có khách nào có đơn hoàn tất
                    if (customersMap.size === 0) {
                        tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">Chưa có đơn hàng nào hoàn tất (Đã thanh toán).</td></tr>`;
                        return;
                    }

                    // 2. Sắp xếp khách hàng theo tổng tiền đã thanh toán giảm dần (Top doanh thu cao nhất)
                    const sortedCustomers = Array.from(customersMap.values()).sort((a, b) => b.totalSpent - a.totalSpent);

                    tbody.innerHTML = '';
                    sortedCustomers.forEach((c, index) => {
                        let rankBadge = `<span class="badge bg-secondary">Top ${index + 1}</span>`;
                        if (index === 0) rankBadge = `<span class="badge vip-badge px-2 py-1"><i class="fa-solid fa-crown me-1"></i> TOP 1 VIP</span>`;
                        else if (index === 1) rankBadge = `<span class="badge bg-warning text-dark px-2 py-1">TOP 2</span>`;
                        else if (index === 2) rankBadge = `<span class="badge bg-info text-dark px-2 py-1">TOP 3</span>`;

                        tbody.innerHTML += `
                            <tr>
                                <td>${rankBadge}</td>
                                <td class="fw-bold">${c.fullName}</td>
                                <td>${c.phone}</td>
                                <td><span class="badge bg-dark">${c.totalOrders} đơn hoàn tất</span></td>
                                <td class="fw-bold text-success fs-6">${formatMoney(c.totalSpent)}</td>
                                <td class="text-muted text-truncate" style="max-width: 250px;" title="${c.address}">${c.address}</td>
                            </tr>
                        `;
                    });
                }
            } catch (err) { console.error(err); }
        };

        const adminLogout = () => { localStorage.removeItem('ADMIN_TOKEN'); window.location.href = '/admin/login.html'; };
        document.addEventListener('DOMContentLoaded', () => { checkAdminAuth(); loadCustomerRanking(); });
    </script>
</body>

</html>
