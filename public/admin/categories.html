<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Danh mục - Admin YOUTH SHOP</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .sidebar { width: 260px; min-height: 100vh; background: #111827; color: white; position: fixed; top: 0; left: 0; z-index: 100; transition: transform 0.3s ease-in-out; }
        .sidebar a { color: #9ca3af; text-decoration: none; padding: 12px 20px; display: block; transition: var(--transition); border-radius: 8px; margin: 4px 12px; }
        .sidebar a:hover, .sidebar a.active { color: white; background: rgba(255, 255, 255, 0.1); }
        .main-content { margin-left: 260px; padding: 30px; }

        /* Responsive cho Mobile */
        @media (max-width: 991.98px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.show { transform: translateX(0); }
            .main-content { margin-left: 0 !important; padding: 15px !important; }
        }
    </style>
</head>
<body class="bg-light">

    <!-- MOBILE NAVBAR HEADER (Chỉ hiện trên điện thoại) -->
    <nav class="navbar navbar-dark bg-dark d-lg-none px-3 py-2">
        <button class="btn btn-outline-light btn-sm" onclick="toggleSidebar()">
            <i class="fa-solid fa-bars fs-5"></i>
        </button>
        <span class="navbar-brand fs-6 fw-bold">ADMIN PANEL</span>
        <button class="btn btn-outline-danger btn-sm" onclick="adminLogout()"><i class="fa-solid fa-right-from-bracket"></i></button>
    </nav>

    <!-- SIDEBAR -->
    <div class="sidebar d-flex flex-column py-4" id="adminSidebar">
        <div class="d-flex justify-content-between align-items-center px-3 mb-4 d-lg-none">
            <h4 class="fw-bold tracking-wider mb-0 text-white">MENU</h4>
            <button class="btn text-white fs-4" onclick="toggleSidebar()">&times;</button>
        </div>
        <h4 class="text-center fw-bold mb-4 tracking-wider d-none d-lg-block">ADMIN PANEL</h4>
        <div class="flex-grow-1">
            <a href="/admin/dashboard.html"><i class="fa-solid fa-chart-pie me-2"></i> Dashboard</a>
            <a href="/admin/orders.html"><i class="fa-solid fa-box-open me-2"></i> Quản lý Đơn hàng</a>
            <a href="/admin/products.html"><i class="fa-solid fa-shirt me-2"></i> Quản lý Sản phẩm</a>
            <a href="/admin/categories.html" class="active"><i class="fa-solid fa-list me-2"></i> Quản lý Danh mục</a>
            <a href="/admin/keys.html"><i class="fa-solid fa-key me-2"></i> Quản lý KEY</a>
            <a href="/admin/customers.html"><i class="fa-solid fa-users me-2"></i> Khách hàng VIP</a>
            <a href="/admin/top-products.html"><i class="fa-solid fa-fire me-2"></i> Top Bán chạy</a>
            <a href="/admin/settings.html"><i class="fa-solid fa-gear me-2"></i> Cài đặt</a>
        </div>
        <div class="px-3 d-none d-lg-block">
            <button class="btn btn-outline-danger w-100 btn-sm" onclick="adminLogout()"><i class="fa-solid fa-right-from-bracket me-2"></i> Đăng xuất</button>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold fs-4">Quản lý Danh mục sản phẩm</h2>
            <button class="btn btn-youth btn-sm" data-bs-toggle="modal" data-bs-target="#addCategoryModal">
                <i class="fa-solid fa-plus me-1"></i> Thêm danh mục
            </button>
        </div>

        <div class="youth-card p-3 p-md-4">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Tên danh mục</th>
                            <th>Slug URL</th>
                            <th>Mô tả</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="categoriesTableBody">
                        <tr>
                            <td colspan="5" class="text-center py-4">Đang tải dữ liệu...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL THÊM DANH MỤC -->
    <div class="modal fade" id="addCategoryModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Thêm danh mục mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addCategoryForm">
                        <div class="mb-3">
                            <label class="form-label">Tên danh mục <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="catName" placeholder="VD: Áo Thun, Phụ kiện..." required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Mô tả</label>
                            <textarea class="form-control" id="catDesc" rows="3" placeholder="Mô tả ngắn về danh mục..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-youth w-100 py-2">LƯU DANH MỤC</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS & SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        const checkAdminAuth = () => {
            const token = localStorage.getItem('ADMIN_TOKEN');
            if (!token) window.location.href = '/admin/login.html';
        };

        // Hàm bật/tắt Sidebar trên mobile
        const toggleSidebar = () => {
            document.getElementById('adminSidebar').classList.toggle('show');
        };

        // 1. Tải danh sách danh mục hiển thị ra bảng
        const loadCategories = async () => {
            try {
                const res = await fetch('/api/categories');
                const result = await res.json();
                if (result.success) {
                    const tbody = document.getElementById('categoriesTableBody');
                    if (result.data.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-muted">Chưa có danh mục nào.</td></tr>`;
                        return;
                    }

                    tbody.innerHTML = '';
                    result.data.forEach(cat => {
                        tbody.innerHTML += `
                            <tr>
                                <td class="fw-bold">${cat.name}</td>
                                <td><code>${cat.slug}</code></td>
                                <td class="text-muted">${cat.description || 'Không có mô tả'}</td>
                                <td><span class="badge bg-success">Hoạt động</span></td>
                                <td>
                                    <button class="btn btn-outline-danger btn-sm" onclick="deleteCategory('${cat._id}')">
                                        <i class="fa-solid fa-trash-can"></i>
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                }
            } catch (err) {
                console.error('Lỗi tải danh mục:', err);
            }
        };

        // 2. Thêm danh mục mới qua Form
        document.getElementById('addCategoryForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = localStorage.getItem('ADMIN_TOKEN');
            const newCat = {
                name: document.getElementById('catName').value.trim(),
                description: document.getElementById('catDesc').value.trim()
            };

            try {
                const res = await fetch('/api/categories', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json', 
                        'Authorization': `Bearer ${token}` 
                    },
                    body: JSON.stringify(newCat)
                });
                const result = await res.json();

                if (result.success) {
                    Swal.fire('Thành công', 'Thêm danh mục mới thành công!', 'success');
                    document.getElementById('addCategoryForm').reset();
                    bootstrap.Modal.getInstance(document.getElementById('addCategoryModal')).hide();
                    loadCategories();
                } else {
                    Swal.fire('Lỗi', result.message, 'error');
                }
            } catch (err) {
                Swal.fire('Lỗi', 'Không thể kết nối máy chủ', 'error');
            }
        });

        // 3. Xóa danh mục
        const deleteCategory = async (id) => {
            Swal.fire({
                title: 'Xóa danh mục?',
                text: "Hành động này sẽ xóa danh mục khỏi hệ thống.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#6b7280',
                confirmButtonText: 'Đồng ý xóa'
            }).then(async (res) => {
                if (res.isConfirmed) {
                    const token = localStorage.getItem('ADMIN_TOKEN');
                    const response = await fetch(`/api/categories/${id}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const data = await response.json();
                    if (data.success) {
                        Swal.fire('Đã xóa', data.message, 'success');
                        loadCategories();
                    } else {
                        Swal.fire('Lỗi', data.message, 'error');
                    }
                }
            });
        };

        const adminLogout = () => { 
            localStorage.removeItem('ADMIN_TOKEN'); 
            window.location.href = '/admin/login.html'; 
        };

        document.addEventListener('DOMContentLoaded', () => { 
            checkAdminAuth(); 
            loadCategories(); 
        });
    </script>
</body>
</html>
